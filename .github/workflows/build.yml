# Builds one flashable firmware image on GitHub's servers, so you don't need
# ESP-IDF installed. Push this project to a GitHub repository, then open
# Actions -> the latest "Build firmware" run -> Artifacts -> eink-assistant-firmware
# (the 8 MB image, with the speech model, plus the files for the SD card).
# The firmware holds no secrets (they live in config.json on the SD card), so a
# public repository is fine.
name: Build firmware

on:
  push:
  workflow_dispatch:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Unit tests, the voice on a PC, and a syntax check of every file
        run: |
          make -C test/host test tts asr speaker components
          bash test/idf_stub/check.sh

      - name: The wake word detector on a PC
        run: |
          git clone -q --depth 1 --branch v1.3.3.1 https://github.com/espressif/esp-tflite-micro.git "$RUNNER_TEMP/tflm"
          make -C test/host wake TFLM="$RUNNER_TEMP/tflm"

      - name: Upload what the voice sounds like
        uses: actions/upload-artifact@v7
        with:
          name: voice-samples
          path: test/host/build/voice_*.wav

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build with ESP-IDF v5.5.6
        uses: espressif/esp-idf-ci-action@v1.2.0
        with:
          esp_idf_version: v5.5.6
          target: esp32s3
          command: idf.py build && idf.py size && idf.py merge-bin -o eink_assistant-merged.bin

      - name: Upload the image and what goes on the SD card
        uses: actions/upload-artifact@v7
        with:
          name: eink-assistant-firmware
          path: |
            build/eink_assistant-merged.bin
            sdcard/
